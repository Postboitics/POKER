<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>포커 카운트 & 정산기</title>
  
  <!-- 안드로이드 / iOS 홈 화면 설치 (PWA) 메타 태그 -->
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="포커정산">

  <!-- Dynamic Web Manifest Generator (PWA 앱 설치 지원) -->
  <script>
    const manifestJson = {
      name: "포커 카운트 & 정산기",
      short_name: "포커정산",
      start_url: "./",
      display: "standalone",
      background_color: "#0F172A",
      theme_color: "#0F172A",
      orientation: "portrait",
      icons: [
        {
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366F1'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>♠️</text></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestJson)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            android: {
              bg: '#0F172A',
              card: '#1E293B',
              cardHover: '#334155',
              accent: '#6366F1',
              success: '#10B981',
              danger: '#EF4444',
              warning: '#F59E0B'
            }
          }
        }
      }
    }
  </script>
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Noto Sans KR Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0B0F17;
      color: #F8FAFC;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }

    .pulse-glow-red {
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.45);
    }

    .pulse-glow-green {
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-start sm:py-4 sm:px-2">

  <!-- Main Application Root -->
  <div id="root" class="w-full max-w-md min-h-screen sm:min-h-[92vh] bg-slate-950 sm:border sm:border-slate-800 sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col relative"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 기본 초기 데이터 설정 ---
    const DEFAULT_REBUY_PRICE = 5000;

    const DEFAULT_CHIP_SETTINGS = [
      { id: 'white', name: '하얀색 칩', value: 500, color: '#F8FAFC', textColor: '#0F172A', borderColor: '#CBD5E1' },
      { id: 'black', name: '검은색 칩', value: 1000, color: '#1E293B', textColor: '#F8FAFC', borderColor: '#475569' },
      { id: 'green', name: '초록색 칩', value: 5000, color: '#059669', textColor: '#FFFFFF', borderColor: '#34D399' },
      { id: 'red', name: '빨간색 칩', value: 10000, color: '#DC2626', textColor: '#FFFFFF', borderColor: '#FCA5A5' },
      { id: 'blue', name: '파란색 칩', value: 50000, color: '#2563EB', textColor: '#FFFFFF', borderColor: '#93C5FD' },
    ];

    const DEFAULT_PLAYERS = [
      { id: 'p1', name: '플레이어 1', rebuyCount: 0, chips: { white: 0, black: 0, green: 0, red: 0, blue: 0 }, directOverride: '', cumProfit: 0, cumRebuys: 0, cumRounds: 0 },
      { id: 'p2', name: '플레이어 2', rebuyCount: 0, chips: { white: 0, black: 0, green: 0, red: 0, blue: 0 }, directOverride: '', cumProfit: 0, cumRebuys: 0, cumRounds: 0 },
      { id: 'p3', name: '플레이어 3', rebuyCount: 0, chips: { white: 0, black: 0, green: 0, red: 0, blue: 0 }, directOverride: '', cumProfit: 0, cumRebuys: 0, cumRounds: 0 },
      { id: 'p4', name: '플레이어 4', rebuyCount: 0, chips: { white: 0, black: 0, green: 0, red: 0, blue: 0 }, directOverride: '', cumProfit: 0, cumRebuys: 0, cumRounds: 0 },
    ];

    // --- 화폐 포맷팅 유틸리티 ---
    const formatKRW = (amount, includeSign = true) => {
      if (amount === undefined || amount === null || isNaN(amount)) return '0원';
      const formatted = Math.abs(amount).toLocaleString('ko-KR') + '원';
      if (!includeSign) return formatted;
      if (amount > 0) return `+${formatted}`;
      if (amount < 0) return `-${formatted}`;
      return '0원';
    };

    // --- 메인 App 컴포넌트 ---
    function App() {
      // 1. 상태 정의 및 로컬 스토리지 자동 보존
      const [rebuyPrice, setRebuyPrice] = useState(() => {
        const saved = localStorage.getItem('poker_rebuy_price');
        return saved ? Number(saved) : DEFAULT_REBUY_PRICE;
      });

      const [chipSettings, setChipSettings] = useState(() => {
        const saved = localStorage.getItem('poker_chip_settings');
        return saved ? JSON.parse(saved) : DEFAULT_CHIP_SETTINGS;
      });

      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('poker_players_data');
        return saved ? JSON.parse(saved) : DEFAULT_PLAYERS;
      });

      const [roundNumber, setRoundNumber] = useState(() => {
        const saved = localStorage.getItem('poker_round_number');
        return saved ? Number(saved) : 1;
      });

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('poker_history');
        return saved ? JSON.parse(saved) : [];
      });

      // PWA 설치 프롬프트 이벤트
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      // UI 탭 및 모달 상태
      const [activeTab, setActiveTab] = useState('current'); // 'current', 'leaderboard', 'settings'
      const [activeChipModalPlayer, setActiveChipModalPlayer] = useState(null);
      const [showSoftResetModal, setShowSoftResetModal] = useState(false);
      const [showHardResetModal, setShowHardResetModal] = useState(false);
      const [editingPlayerNameId, setEditingPlayerNameId] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // PWA 설치 이벤트 수신
      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      // 데이터 변경 시 자동 로컬 스토리지 구동
      useEffect(() => {
        localStorage.setItem('poker_rebuy_price', rebuyPrice);
        localStorage.setItem('poker_chip_settings', JSON.stringify(chipSettings));
        localStorage.setItem('poker_players_data', JSON.stringify(players));
        localStorage.setItem('poker_round_number', roundNumber);
        localStorage.setItem('poker_history', JSON.stringify(history));
      }, [rebuyPrice, chipSettings, players, roundNumber, history]);

      // 토스트 메시지 팝업
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // PWA 앱 설치 버튼 클릭
      const handleInstallApp = async () => {
        if (!deferredPrompt) {
          showToast('크롬 메뉴의 [홈 화면에 추가]를 눌러 설치해 보세요!');
          return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          showToast('앱 설치가 완료되었습니다.');
        }
        setDeferredPrompt(null);
      };

      // --- 핵심 계산 함수 ---
      // 1) 개별 투입금 (기본 1회 + 리바인 횟수 * 단가)
      const getPlayerBuyIn = (player) => {
        return (1 + (player.rebuyCount || 0)) * rebuyPrice;
      };

      // 2) 개별 최종 보유 칩 총액 (직접 입력값 오버라이드 > 칩 수량 자동 계산)
      const getPlayerChipsTotal = (player) => {
        if (player.directOverride !== '' && player.directOverride !== null && !isNaN(player.directOverride)) {
          return Number(player.directOverride);
        }
        let total = 0;
        chipSettings.forEach(chip => {
          const qty = player.chips?.[chip.id] || 0;
          total += qty * chip.value;
        });
        return total;
      };

      // 3) 개별 이번 판 손익 (칩 금액 - 총 투입 금액)
      const getPlayerProfit = (player) => {
        return getPlayerChipsTotal(player) - getPlayerBuyIn(player);
      };

      // 4) 전체 집계 및 오차 계산
      const totalBuyIn = useMemo(() => {
        return players.reduce((sum, p) => sum + getPlayerBuyIn(p), 0);
      }, [players, rebuyPrice]);

      const totalChips = useMemo(() => {
        return players.reduce((sum, p) => sum + getPlayerChipsTotal(p), 0);
      }, [players, chipSettings]);

      const difference = totalChips - totalBuyIn; // 0원일 때 완전 정산
      const isBalanced = difference === 0;

      // --- 플레이어 관리 및 조작 ---
      const handleAddPlayer = () => {
        const nextId = 'p_' + Date.now();
        const nextNum = players.length + 1;
        const newPlayer = {
          id: nextId,
          name: `플레이어 ${nextNum}`,
          rebuyCount: 0,
          chips: { white: 0, black: 0, green: 0, red: 0, blue: 0 },
          directOverride: '',
          cumProfit: 0,
          cumRebuys: 0,
          cumRounds: 0
        };
        setPlayers([...players, newPlayer]);
        showToast(`'${newPlayer.name}' 추가 완료`);
      };

      const handleDeletePlayer = (id, name) => {
        if (players.length <= 2) {
          showToast('최소 2명의 플레이어가 필요합니다.');
          return;
        }
        setPlayers(players.filter(p => p.id !== id));
        showToast(`'${name}' 삭제 완료`);
      };

      const handleUpdateRebuy = (id, delta) => {
        setPlayers(players.map(p => {
          if (p.id === id) {
            const current = p.rebuyCount || 0;
            const updated = Math.max(0, current + delta);
            return { ...p, rebuyCount: updated };
          }
          return p;
        }));
      };

      const handleDirectOverrideChange = (id, val) => {
        setPlayers(players.map(p => {
          if (p.id === id) {
            return { ...p, directOverride: val };
          }
          return p;
        }));
      };

      const handleUpdatePlayerChips = (playerId, newChipsObj) => {
        setPlayers(players.map(p => {
          if (p.id === playerId) {
            return { ...p, chips: newChipsObj, directOverride: '' };
          }
          return p;
        }));
      };

      const handleNameChange = (id, newName) => {
        if (!newName.trim()) return;
        setPlayers(players.map(p => p.id === id ? { ...p, name: newName.trim() } : p));
        setEditingPlayerNameId(null);
      };

      // --- 소프트 / 하드 리셋 로직 ---
      // 1. 소프트 리셋 (다음 판 넘어가기)
      //    - 유지: 리바인 단가, 칩 단가, 플레이어 이름 및 인원
      //    - 누적: 개인별 이번 판 손익 & 리바인 수량을 누적 랭킹에 합산
      //    - 초기화: 현재 판 리바인 횟수 및 칩 개수/금액 입력값
      const executeSoftReset = () => {
        const roundSnapshot = {
          round: roundNumber,
          timestamp: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
          totalPot: totalBuyIn,
          difference: difference,
          playerResults: players.map(p => ({
            name: p.name,
            buyIn: getPlayerBuyIn(p),
            chips: getPlayerChipsTotal(p),
            profit: getPlayerProfit(p),
            rebuys: p.rebuyCount
          }))
        };

        const updatedHistory = [roundSnapshot, ...history];

        const resetPlayers = players.map(p => {
          const roundProfit = getPlayerProfit(p);
          const roundRebuys = p.rebuyCount || 0;
          return {
            ...p,
            cumProfit: (p.cumProfit || 0) + roundProfit,
            cumRebuys: (p.cumRebuys || 0) + roundRebuys,
            cumRounds: (p.cumRounds || 0) + 1,
            rebuyCount: 0,
            chips: { white: 0, black: 0, green: 0, red: 0, blue: 0 },
            directOverride: ''
          };
        });

        setPlayers(resetPlayers);
        setHistory(updatedHistory);
        setRoundNumber(roundNumber + 1);
        setShowSoftResetModal(false);
        showToast(`제 ${roundNumber}판 정산 완료! 다음 판이 시작되었습니다.`);
      };

      // 2. 하드 리셋 (전체 누적 기록 완전 삭제)
      const executeHardReset = () => {
        const resetPlayers = players.map(p => ({
          ...p,
          rebuyCount: 0,
          chips: { white: 0, black: 0, green: 0, red: 0, blue: 0 },
          directOverride: '',
          cumProfit: 0,
          cumRebuys: 0,
          cumRounds: 0
        }));

        setPlayers(resetPlayers);
        setHistory([]);
        setRoundNumber(1);
        setShowHardResetModal(false);
        showToast('모든 누적 손익과 기록이 하드 리셋 되었습니다.');
      };

      // 랭킹 정렬
      const rankedPlayers = useMemo(() => {
        return [...players].sort((a, b) => (b.cumProfit || 0) - (a.cumProfit || 0));
      }, [players]);

      // 최고 리바인왕
      const maxRebuyPlayerId = useMemo(() => {
        let max = 0;
        let pId = null;
        players.forEach(p => {
          if ((p.cumRebuys || 0) > max) {
            max = p.cumRebuys;
            pId = p.id;
          }
        });
        return pId;
      }, [players]);

      return (
        <div className="flex-1 flex flex-col h-full overflow-hidden relative select-none">

          {/* === 1. 안드로이드 스타일 상단 헤더 BAR === */}
          <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10">
            <div className="flex items-center space-x-2.5">
              <span className="text-2xl">♠️</span>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-white flex items-center gap-2">
                  포커 정산 노트
                  <span className="text-[11px] bg-indigo-600/40 text-indigo-300 border border-indigo-500/50 px-2 py-0.5 rounded-full font-bold">
                    Round {roundNumber}
                  </span>
                </h1>
                <p className="text-[11px] text-slate-400">1회 리바인: {formatKRW(rebuyPrice, false)}</p>
              </div>
            </div>

            <div className="flex items-center space-x-1.5">
              <button
                onClick={() => setShowSoftResetModal(true)}
                className="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-bold rounded-xl transition shadow flex items-center gap-1"
                title="현재 판 정산 후 누적하고 다음 판 시작"
              >
                <span>🔄</span> 소프트 리셋
              </button>

              <button
                onClick={() => setShowHardResetModal(true)}
                className="px-2 py-1.5 bg-slate-800 hover:bg-rose-950 text-rose-400 border border-slate-700 active:scale-95 text-xs font-bold rounded-xl transition"
                title="누적 데이터를 포함해 전체 초기화"
              >
                하드 리셋
              </button>
            </div>
          </header>

          {/* === 2. 실시간 오차 검수 BAR (차액 0원: 초록색 / 오차시: 붉은색) === */}
          <div className="px-3 py-2 bg-slate-950 z-10">
            <div className={`rounded-2xl p-3 border transition-all duration-300 flex items-center justify-between ${
              isBalanced 
                ? 'bg-emerald-950/80 border-emerald-500/60 text-emerald-200 pulse-glow-green' 
                : 'bg-rose-950/90 border-rose-500 text-rose-100 pulse-glow-red'
            }`}>
              <div className="flex items-center space-x-2.5">
                <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-sm shrink-0 ${
                  isBalanced ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white animate-pulse'
                }`}>
                  {isBalanced ? '✓' : '!'}
                </div>
                <div>
                  <div className="font-extrabold text-sm flex items-center gap-2">
                    {isBalanced ? (
                      <span className="text-emerald-400">정상 정산 가능 (차액 0원)</span>
                    ) : (
                      <span className="text-rose-400 font-black">
                        오차 발생: {difference > 0 ? `+${difference.toLocaleString()}원` : `${difference.toLocaleString()}원`}
                      </span>
                    )}
                  </div>
                  <div className="text-[11px] opacity-80 mt-0.5">
                    총 투입: <span className="font-semibold">{formatKRW(totalBuyIn, false)}</span> | 총 칩: <span className="font-semibold">{formatKRW(totalChips, false)}</span>
                  </div>
                </div>
              </div>

              {!isBalanced && (
                <div className="text-right shrink-0">
                  <span className="inline-block text-[10px] bg-rose-500/30 text-rose-200 border border-rose-400/40 px-2 py-1 rounded-lg font-bold">
                    {difference > 0 ? '칩 과다' : '칩 부족'}
                  </span>
                </div>
              )}
            </div>
          </div>

          {/* === 3. 메인 콘텐츠 뷰 영역 === */}
          <main className="flex-1 overflow-y-auto px-3 py-2 space-y-3">

            {/* [TAB 1] 라운드 정산 입력 화면 */}
            {activeTab === 'current' && (
              <div className="space-y-3 pb-24">
                {/* 헤더 툴바 */}
                <div className="flex items-center justify-between px-1">
                  <span className="text-xs font-bold text-slate-400 flex items-center gap-1">
                    👥 참여 플레이어 ({players.length}명)
                  </span>
                  <button
                    onClick={handleAddPlayer}
                    className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-400 border border-indigo-500/30 rounded-full text-xs font-bold flex items-center gap-1 active:scale-95 transition"
                  >
                    <span>+</span> 플레이어 추가
                  </button>
                </div>

                {/* 플레이어별 카드 리스트 */}
                {players.map((player) => {
                  const buyIn = getPlayerBuyIn(player);
                  const chipsTotal = getPlayerChipsTotal(player);
                  const profit = getPlayerProfit(player);
                  const isEditingName = editingPlayerNameId === player.id;

                  return (
                    <div 
                      key={player.id} 
                      className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-md relative overflow-hidden transition-all hover:border-slate-700"
                    >
                      {/* 플레이어 카드 헤더 (이름 & 정산 결산 뱃지) */}
                      <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-800/80">
                        <div className="flex items-center space-x-2">
                          {isEditingName ? (
                            <input
                              type="text"
                              defaultValue={player.name}
                              autoFocus
                              className="bg-slate-950 border border-indigo-500 text-white px-2 py-1 rounded-lg text-sm font-bold w-32 focus:outline-none"
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') handleNameChange(player.id, e.target.value);
                              }}
                              onBlur={(e) => handleNameChange(player.id, e.target.value)}
                            />
                          ) : (
                            <div className="flex items-center space-x-1.5">
                              <span className="font-extrabold text-base text-white tracking-tight">{player.name}</span>
                              <button 
                                onClick={() => setEditingPlayerNameId(player.id)}
                                className="text-slate-500 hover:text-slate-300 text-xs p-1"
                                title="이름 변경"
                              >
                                ✏️
                              </button>
                            </div>
                          )}
                        </div>

                        {/* 개인 손익 뱃지 */}
                        <div className="flex items-center space-x-2">

                  <div className="bg-rose-950/80 border border-rose-500/50 p-2.5 rounded-xl text-xs text-rose-200">
                    ⚠️ <b>주의:</b> 현재 정산 오차가 <b>{difference > 0 ? `+${difference}원` : `${difference}원`}</b> 발생한 상태입니다. 그래도 진행하시겠습니까?
                  </div>
                )}

                <div className="flex items-center space-x-2 pt-1">
                  <button
                    onClick={() => setShowSoftResetModal(false)}
                    className="w-1/2 py-2.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl"
                  >
                    취소
                  </button>
                  <button
                    onClick={executeSoftReset}
                    className="w-1/2 py-2.5 bg-indigo-600 text-white text-xs font-extrabold rounded-xl shadow active:scale-95"
                  >
                    다음 판 시작
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* === MODAL 3: 하드 리셋 확인 모달 === */}
          {showHardResetModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-slate-900 border border-rose-900/60 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="text-center space-y-2">
                  <div className="w-12 h-12 bg-rose-600/20 text-rose-500 rounded-full flex items-center justify-center text-2xl mx-auto">
                    ⚠️
                  </div>
                  <h3 className="font-extrabold text-lg text-white">하드 리셋 (전체 초기화)</h3>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    모든 개인별 누적 손익과 기록이 <span className="text-rose-400 font-bold">완전히 삭제</span>되고 완전히 새로 시작됩니다.
                  </p>
                </div>

                <div className="flex items-center space-x-2 pt-2">
                  <button
                    onClick={() => setShowHardResetModal(false)}
                    className="w-1/2 py-2.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl"
                  >
                    취소
                  </button>
                  <button
                    onClick={executeHardReset}
                    className="w-1/2 py-2.5 bg-rose-600 text-white text-xs font-extrabold rounded-xl shadow active:scale-95"
                  >
                    전체 초기화
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* === 알림 토스트 === */}
          {toastMessage && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-indigo-300 px-4 py-2 rounded-full text-xs font-bold shadow-xl z-50 animate-fade-in">
              {toastMessage}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
